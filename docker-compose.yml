services:

  app:
    build: .
    container_name: if-drone-alert
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TELETHON_API_ID=${TELETHON_API_ID}
      - TELETHON_API_HASH=${TELETHON_API_HASH}
      - TELETHON_STRING_SESSION=${TELETHON_STRING_SESSION}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - REFERENCE_DIR=/app/data/reference
      - LEARNING_DB_PATH=/app/data/learning.db
      - SUBSCRIBERS_DB_PATH=/app/data/subscribers.db
      - API_HOST=0.0.0.0
      - API_PORT=8080
    volumes:
      - ./data:/app/data

